version: "2"
sql:
  - engine: "postgresql"
    queries: 
    - "queries"
    - "queries/generated"
    - "queries/imports"
    schema: "schema"
    gen:
      go:
        package: "biomedb"
        out: "biomedb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        query_parameter_limit: 2
        emit_enum_valid_method: true
        emit_all_enum_values: true
        rename: 
          taxa: "Taxon"
          taxa_closure: "TaxonClosure"
        overrides:
        - db_type: "h3index"
          go_type:
            import: "github.com/uber/h3-go/v4"
            type: "Cell"