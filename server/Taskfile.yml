version: 3

vars:
  DOCKER_IMAGE: '{{.DOCKER_IMAGE | default "biome-backend"}}'
  # Full remote repository, without tag (e.g. registry.example.org/biome/server).
  DOCKER_REMOTE: '{{.DOCKER_REMOTE | default "lsdch/biome-backend"}}'

includes:
  db:
    taskfile: ./db
    dir: ./db

tasks:
  docker:build:
    requires:
      vars: [DOCKER_TAG]
    interactive: true
    desc: "Build the backend Docker image"
    dir: '{{.TASKFILE_DIR}}'
    cmd: docker build --file docker/Dockerfile --tag '{{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}' .

  docker:push:
    requires:
      vars: [DOCKER_TAG]
    desc: "Tag and push the backend image to DOCKER_REMOTE"
    preconditions:
      - sh: test -n '{{.DOCKER_REMOTE}}'
        msg: "Set DOCKER_REMOTE to the full remote repository, without a tag."
    cmds:
      - docker tag '{{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}' '{{.DOCKER_REMOTE}}:{{.DOCKER_TAG}}'
      - docker push '{{.DOCKER_REMOTE}}:{{.DOCKER_TAG}}'

  install-linter:
    internal: true
    cmd: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.56.2
    status: [command -v golangci-lint >/dev/null 2>&1]

  install-air:
    internal: true
    cmd: go install github.com/cosmtrek/air@latest
    status: [command -v air >/dev/null 2>&1]

  install-templ:
    internal: true
    cmd: go install github.com/a-h/templ/cmd/templ@latest
    status: [command -v templ >/dev/null 2>&1]

  install:
    desc: "Install tools for backend dev environment"
    cmd: go get
    deps: [install-linter, install-air, install-templ]

  start:
    desc: "Start backend dev server"
    deps: [db:init, install]
    cmds: [air]

  lint:
    desc: "Run golangci-lint"
    cmd: golangci-lint run --fast --print-issued-lines=false --out-format=colored-line-number --issues-exit-code=0
    deps: [install-linter]

  generate-templ: 
    desc: "Generate Go code from HTML templates"
    cmd: go tool templ generate
    deps: [install-templ]
  
  generate:
    desc: "Generate code for backend"
    deps: [generate-templ, db:generate]
    cmds: 
      - go generate .
