                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /taxonomy/taxa:
    post:
      tags:
      - Taxonomy
