  /taxonomy/search:
    get:
      tags:
      - Taxonomy
      summary: Search for taxa
      operationId: SearchTaxa
      parameters:
      - name: search_term
        in: query
        explode: false
        schema:
          type: string
      - name: ranks
        in: query
        explode: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/TaxonRank"
      - name: sampled_only
        in: query
        explode: false
        schema:
          type: boolean
      - name: limit
        in: query
        explode: false
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        explode: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Taxon"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
