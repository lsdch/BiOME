      operationId: CreateTaxon
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxonInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxon"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: admin
  /taxonomy/taxa/{id}:
    get:
      tags:
      - Taxonomy
