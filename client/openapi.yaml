openapi: 3.1.0
info:
  title: BiOME API
  description: "BiOME API: Biodiversity and Occurrences for Molecular Ecology"
  contact:
    name: Louis Duchemin
    email: ls.duchemin@gmail.com
  version: 0.0.0
servers:
- url: //localhost:5173/api/v1
paths:
  /abiotics/parameters:
    get:
      tags:
      - Abiotics
      summary: List abiotic parameters
      operationId: ListAbioticParameters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbioticParam"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /access-points:
    get:
      tags:
      - Samplings
      summary: List access points
      description: List all unique access points for samplings.
      operationId: ListAccessPoints
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /accounts:
    get:
      tags:
      - Accounts
      summary: List all users
      operationId: ListUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: admin
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate a user and return a JWT token
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCredentials"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Invalidate the current user's session
      operationId: Logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Get the current authenticated user's information
      operationId: GetCurrentUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh the current user's session
      operationId: RefreshSession
      parameters:
      - name: X-Refresh-Token
        in: header
        required: true
        schema:
          type: string
      - name: X-Session-ID
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /datasets:
    get:
      tags:
      - Datasets
      summary: List datasets
      operationId: ListDatasets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dataset"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /datasets/{ulid}:
    get:
      tags:
      - Datasets
      summary: Get dataset by ID
      operationId: GetDatasetByID
      parameters:
      - name: ulid
        in: path
        required: true
        schema:
          type: string
          format: ulid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /datasets/{ulid}/occurrences:
    get:
      tags:
      - Datasets
      summary: Load occurrences for dataset
      operationId: LoadOccurrencesForDataset
      parameters:
      - name: ulid
        in: path
        required: true
        schema:
          type: string
          format: ulid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Occurrence"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /fixatives:
    get:
      tags:
      - Sampling
      summary: List sampling fixatives
      operationId: ListFixatives
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fixative"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
    post:
      tags:
      - Sampling
      summary: Create a new sampling fixative
      operationId: CreateFixative
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixativeInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fixative"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: maintainer
  /fixatives/{code}:
    delete:
      tags:
      - Sampling
      summary: Delete a sampling fixative by code
      operationId: DeleteFixative
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: maintainer
    patch:
      tags:
      - Sampling
      summary: Update a sampling fixative by code
      operationId: UpdateFixative
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixativeUpdateParams"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fixative"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: maintainer
  /geoapify/reverse-geocode:
    get:
      tags:
      - Services
      summary: Reverse geocode coordinates using Geoapify API
      operationId: ReverseGeocode
      parameters:
      - name: latitude
        in: query
        explode: false
        schema:
          type: number
          format: double
      - name: longitude
        in: query
        explode: false
        schema:
          type: number
          format: double
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoapifyResult"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /geoapify/reverse-geocode/batch:
    post:
      tags:
      - Services
      summary: Batch reverse geocode coordinates using Geoapify API
      operationId: BatchReverseGeocode
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GeoapifyCoords"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeoapifyResult"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /geoapify/status:
    get:
      tags:
      - Services
      summary: Get Geoapify API status
      operationId: GetGeoapifyStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoapifyStatus"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /geoapify/usage/history:
    get:
      tags:
      - Services
      summary: List Geoapify usage history
      operationId: ListGeoapifyUsage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeoapifyUsage"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /habitats:
    get:
      tags:
      - Habitats
      summary: Get all habitat groups with their elements
      operationId: GetHabitatGroups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitatGroupWithElements"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
    post:
      tags:
      - Habitats
      summary: Create a new habitat group with its elements
      operationId: CreateHabitatGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitatGroupInput"
        required: true
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: admin
  /habitats/{id}:
    delete:
      tags:
      - Habitats
      summary: Delete a habitat group by its ID
      operationId: DeleteHabitatGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: admin
    patch:
      tags:
      - Habitats
      summary: Update a habitat group by its ID
      operationId: UpdateHabitatGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitatGroupUpdate"
        required: true
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: admin
  /import-batches:
    get:
      tags:
      - Imports
      summary: List import batches
      operationId: ListImportBatches
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportBatch"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /import-batches/with-content:
    get:
      tags:
      - Imports
      summary: List import batches with content summary
      operationId: ListImportBatchesWithContent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportBatchWithContent"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /import-batches/{id}:
    get:
      tags:
      - Imports
      summary: Get a specific import batch
      operationId: GetImportBatch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
    delete:
      tags:
      - Imports
      summary: Delete an import batch
      operationId: DeleteImportBatch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: maintainer
  /import-batches/{id}/raw:
    get:
      tags:
      - Imports
      summary: Download the raw file for an import batch
      operationId: DownloadRawFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /import-batches/{id}/with-content:
    get:
      tags:
      - Imports
      summary: Get a specific import batch with content summary
      operationId: GetImportBatchWithContent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchWithContent"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy: {}
  /imports/batch/{id}/status/track:
    get:
      tags:
      - Batch Imports
      summary: Get import status updates via Server-Sent Events (SSE)
      operationId: TrackImportStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/BatchSnapshot"
        default:
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: contributor
  /imports/batches:
    get:
      tags:
      - Batch Imports
      summary: List import batchs
      operationId: ListImports
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchSnapshot"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: contributor
    post:
      tags:
      - Batch Imports
      summary: Import occurrence data from CSV
      operationId: ImportOccurrencesCSV
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                batch:
                  $ref: "#/components/schemas/ImportBatchInput"
                file:
                  type: string
                  format: binary
                  contentEncoding: binary
                merge_undated_samplings:
                  type: boolean
                  description: If true, undated samplings with the same location and method will be merged into a single sampling.
                quotes:
                  type: string
                separator:
                  type: string
                taxon_definitions:
                  type: array
                  description: List of taxon definitions to resolve inconsistent taxa in the import batch.
                  items:
                    $ref: "#/components/schemas/TaxonDefinition"
              required:
              - batch
              - file
              - separator
              - quotes
            encoding:
              batch:
                contentType: application/json
              file:
                contentType: text/tab-separated-values
              merge_undated_samplings:
                contentType: text/plain
              quotes:
                contentType: text/plain
              separator:
                contentType: text/plain
              taxon_definitions:
                contentType: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: contributor
  /imports/batches/by-user:
    get:
      tags:
      - Batch Imports
      summary: List import batchs for the current user
      operationId: ListImportsForCurrentUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchSnapshot"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: contributor
  /imports/batches/imports/batch/{id}/bibliography:
    get:
      tags:
      - Batch Imports
      summary: Get bibliography resolution state and candidates
      operationId: GetBibliographyResolutions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicationResolutionWithCandidates"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: contributor
    patch:
      tags:
      - Batch Imports
      summary: Resolve publication for import ID
      operationId: ResolvePublication
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveInput"
        required: true
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: contributor
  /imports/batches/imports/batch/{id}/fixatives:
    get:
      tags:
      - Batch Imports
      summary: Get sampling fixatives resolution state
      operationId: GetFixativesResolution
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SamplingFixativeResolution"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
      x-policy:
        role: contributor
    patch:
      tags:
      - Batch Imports
      summary: Resolve sampling fixative for import ID
      operationId: ResolveFixative
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamplingFixativeResolutionInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamplingFixativeResolution"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
