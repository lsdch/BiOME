version: "3"

vars:
  DOCKER_IMAGE: '{{.DOCKER_IMAGE | default "biome-frontend"}}'
  # Full remote repository, without tag.
  DOCKER_REMOTE: '{{.DOCKER_REMOTE | default "lsdch/biome-frontend"}}'

tasks:
  docker:build:
    requires:
      vars: [DOCKER_TAG]
    interactive: true
    desc: "Build the frontend Docker image"
    # The Dockerfile also copies biome_logo.svg from the repository root.
    dir: '{{.TASKFILE_DIR}}/..'
    cmd: docker build --file client/docker/Dockerfile --tag '{{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}' .

  docker:push:
    requires:
      vars: [DOCKER_TAG]
    desc: "Tag and push the frontend image to DOCKER_REMOTE"
    preconditions:
      - sh: test -n '{{.DOCKER_REMOTE}}'
        msg: "Set DOCKER_REMOTE to the full remote repository, without a tag."
    cmds:
      - docker tag '{{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}' '{{.DOCKER_REMOTE}}:{{.DOCKER_TAG}}'
      - docker push '{{.DOCKER_REMOTE}}:{{.DOCKER_TAG}}'

  install-pnpm:
    internal: true
    cmd: wget -qO- https://get.pnpm.io/install.sh | sh -
    status: [command -v pnpm >/dev/null 2>&1]

  install:
    desc: "Install pnpm"
    deps: [install-pnpm]
    cmd: pnpm i

  start:
    desc: "Start client dev server"
    deps: [install-client]
    cmd: pnpm dev --host
