version: "3"

vars:
  TEST_DB_NAME: testing

includes:
  client:
    taskfile: ./client
    dir: ./client
  server:
    taskfile: ./server
    dir: ./server

output: group

tasks:
  sync:
    desc: "Install dependencies and apply migrations"
    deps:
      - task: server:install
      - task: client:install
  setup:
    desc: "Install dependencies"
    deps:
      - server:install
      - task: client:install
        silent: true
  lint:
    desc: "Run golangci-lint"
    deps: [server:lint]
