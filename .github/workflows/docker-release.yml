name: Publish Docker images and GitHub release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    env:
      DOCKER_TAG: ${{ github.ref_name }}
      BACKEND_IMAGE: docker.io/lsdch/biome-backend
      FRONTEND_IMAGE: docker.io/lsdch/biome-frontend
    steps:
      - name: Check out BiOME
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out the Huma fork
        uses: actions/checkout@v6
        with:
          repository: lsdch/huma
          ref: b8a026e0d07b9062b07f64e561be9f68afa6b9cf
          path: server/huma
          token: ${{ secrets.HUMA_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Build images
        run: |
          docker build --file server/docker/Dockerfile --tag "$BACKEND_IMAGE:$DOCKER_TAG" server
          docker build --file client/docker/Dockerfile --tag "$FRONTEND_IMAGE:$DOCKER_TAG" .

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        run: |
          docker push "$BACKEND_IMAGE:$DOCKER_TAG"
          docker push "$FRONTEND_IMAGE:$DOCKER_TAG"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null; then
            exit 0
          fi

          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
